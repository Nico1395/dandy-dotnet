name: "Test projects"

on:
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened ]

env:
  SLN: "./src/DandyDotnet.slnx"
  DOTNET_VERSION: "10.0.x"

jobs:
  test:
    name: "Run unit tests"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Docker info"
      run: "docker info"
    
    - name: "Checkout"
      uses: "actions/checkout@v4"
      with:
        fetch-depth: 0

    - name: "Setup .NET"
      uses: "actions/setup-dotnet@v4"
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "Restore dependencies"
      run: "dotnet restore ${{ env.SLN }}"

    - name: "Build solution"
      run: "dotnet build ${{ env.SLN }} --no-restore --configuration Release"

    - name: "Run unit tests"
      run: "dotnet test ${{ env.SLN }} --no-restore --configuration Release"
